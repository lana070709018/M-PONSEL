<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-PONSEL - POS Konter HP & Pulsa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#06b6d4', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 10% 20%, rgba(12, 74, 110, 0.4) 0%, rgba(3, 7, 18, 0.95) 90%), radial-gradient(circle at 90% 80%, rgba(88, 28, 135, 0.3) 0%, rgba(3, 7, 18, 0.98) 90%); background-attachment: fixed; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .bg-grid-pattern { background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
    .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); }
    .glass-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); color: #f8fafc; }
    .glass-input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }
    @media print {
      @page { margin: 0; size: 58mm auto; }
      body * { visibility: hidden; }
      #printableReceipt, #printableReceipt * { visibility: visible; }
      #printableReceipt { position: absolute; left: 0; top: 0; width: 58mm !important; padding: 2mm 3mm !important; margin: 0 !important; background: white !important; color: black !important; font-size: 9pt !important; line-height: 1.2 !important; box-shadow: none !important; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="text-slate-100 min-h-screen flex flex-col bg-grid-pattern relative antialiased selection:bg-cyan-500 selection:text-white">
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
  </main>
  <script>
    let appState = { currentUser: null, cart: [], currentCategory: 'aksesoris', selectedOperator: 'Telkomsel' };
    const defaultProducts = [
      { id: '1', sku: 'ACC-001', name: 'Kabel Data Type-C Fast Charge', category: 'Charger', buyPrice: 10000, sellPrice: 25000, stock: 18, image: '' },
      { id: '2', sku: 'ACC-002', name: 'Charger Original 20W', category: 'Charger', buyPrice: 45000, sellPrice: 85000, stock: 12, image: '' },
      { id: '3', sku: 'ACC-003', name: 'Tempered Glass All Type', category: 'Aksesori', buyPrice: 5000, sellPrice: 20000, stock: 45, image: '' }
    ];
    const defaultUsers = [
      { id: 'u1', name: 'Administrator M-Ponsel', username: 'admin', password: 'admin123', role: 'admin', status: 'active' },
      { id: 'u2', name: 'Kasir Toko 1', username: 'kasir', password: 'kasir123', role: 'kasir', status: 'active' }
    ];
    function initData() {
      if (!localStorage.getItem('mponsel_products')) localStorage.setItem('mponsel_products', JSON.stringify(defaultProducts));
      if (!localStorage.getItem('mponsel_users')) localStorage.setItem('mponsel_users', JSON.stringify(defaultUsers));
      if (!localStorage.getItem('mponsel_transactions')) localStorage.setItem('mponsel_transactions', JSON.stringify([]));
    }
    
    function getProducts() { return JSON.parse(localStorage.getItem('mponsel_products')) || []; }
    function setProducts(data) { 
        localStorage.setItem('mponsel_products', JSON.stringify(data)); 
        if (window.saveProductsToFirestore) {
            window.saveProductsToFirestore(data);
        }
    }
    function getUsers() { return JSON.parse(localStorage.getItem('mponsel_users')) || []; }
    function setUsers(data) { localStorage.setItem('mponsel_users', JSON.stringify(data)); }
    function getTransactions() { return JSON.parse(localStorage.getItem('mponsel_transactions')) || []; }
    function setTransactions(data) { localStorage.setItem('mponsel_transactions', JSON.stringify(data)); }
    document.addEventListener("DOMContentLoaded", () => {
      initData();
      lucide.createIcons();
    });
  </script>
</body>
</html>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDTPtqlkPppav6Fcz7dknQG4gTu7djeBY4",
    authDomain: "m-ponsel.firebaseapp.com",
    projectId: "m-ponsel",
    storageBucket: "m-ponsel.firebasestorage.app",
    messagingSenderId: "273631311807",
    appId: "1:273631311807:web:2ac9d0e500cde8a0b7930a"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.saveProductsToFirestore = async function(data) {
    try {
      await setDoc(doc(db, "database", "products"), { items: data });
      console.log("Data produk sukses disinkronkan ke Firestore.");
    } catch (error) {
      console.error("Gagal menyimpan ke Firestore: ", error);
    }
  };
  async function loadProductsFromFirestore() {
    try {
      const docSnap = await getDoc(doc(db, "database", "products"));
      if (docSnap.exists()) {
        const cloudData = docSnap.data().items || [];
        localStorage.setItem('mponsel_products', JSON.stringify(cloudData));
        if (typeof window.renderBarangList === "function") window.renderBarangList();
        if (typeof window.renderInventoryTable === "function") window.renderInventoryTable();
        if (typeof window.checkLowStock === "function") window.checkLowStock();
      }
    } catch (error) {
      console.error("Gagal menarik data dari Firestore: ", error);
    }
  }
  loadProductsFromFirestore();
</script>
